services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc_predicao_faltas
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistência de modelos treinados e versionados
      - ./models:/app/models
      # Persistência de uploads de CSV
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
